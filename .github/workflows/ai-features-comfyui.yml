name: AI features, declarative runner and ComfyUI adapter

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['crates/ai-features/**', 'crates/ai-declarative/**', 'crates/ai-comfyui/**', 'crates/ai-model/**', 'crates/ai-media/**', 'crates/ai-native/**', 'crates/ai-test-server/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/ai-features-comfyui.yml']
  pull_request:
    paths: ['crates/ai-features/**', 'crates/ai-declarative/**', 'crates/ai-comfyui/**', 'crates/ai-model/**', 'crates/ai-media/**', 'crates/ai-native/**', 'crates/ai-test-server/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/ai-features-comfyui.yml']

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --check
      - run: cargo clippy -p craft-ai-features -p craft-ai-declarative -p craft-ai-comfyui --all-targets --locked -- -D warnings
      - run: cargo test -p craft-ai-features -p craft-ai-declarative -p craft-ai-comfyui --locked
      # The catalogue is plain data and promises to compile for the web.
      - run: cargo check -p craft-ai-features --target wasm32-unknown-unknown --locked
