[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/craft-libs"

[workspace.dependencies]
# internal: add each crate here as `craft-<name> = { path = "crates/<name>" }`
craft-ai-media = { path = "crates/ai-media" }
craft-ai-model = { path = "crates/ai-model" }
craft-ai-native = { path = "crates/ai-native" }
craft-ai-test-server = { path = "crates/ai-test-server" }
craft-ai-openai = { path = "crates/ai-openai" }
craft-ai-bfl = { path = "crates/ai-bfl" }
craft-ai-vertex = { path = "crates/ai-vertex" }
craft-ai-artcraft = { path = "crates/ai-artcraft" }
craft-ai-seedance = { path = "crates/ai-seedance" }
craft-ai-sam3 = { path = "crates/ai-sam3" }
craft-ai-features = { path = "crates/ai-features" }
craft-ai-declarative = { path = "crates/ai-declarative" }
craft-ai-comfyui = { path = "crates/ai-comfyui" }
craft-ai-comfy-env = { path = "crates/ai-comfy-env" }
craft-atomic = { path = "crates/atomic" }
craft-cms = { path = "crates/cms" }
craft-print = { path = "crates/print" }
craft-quit = { path = "crates/quit" }
craft-settings = { path = "crates/settings" }
craft-ui = { path = "crates/ui" }
egui = { version = "0.36", default-features = false }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
